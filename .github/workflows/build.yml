# Upstream golang.org/x/net has no GitHub Actions CI (it is developed on Gerrit
# at go.googlesource.com/net and tested by the Go project's own build
# coordinator). This workflow is authored by Seal to build the module, run its
# own test suite, and produce the module source zip that proxy.golang.org serves.
name: build

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Space-separated Go test names to run. Empty runs the full suite."
        required: false
        default: ""

permissions:
  contents: read

env:
  # Resolve dependencies as they existed at the v0.45.0 release date.
  # "|" falls back to the public proxy on any error, not only 404/410.
  GOPROXY: https://time-machines-go.sealsecurity.io/|https://proxy.golang.org,direct
  MODULE_PATH: golang.org/x/net
  MODULE_VERSION: v0.45.0

jobs:
  build:
    name: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # The toolchain the release itself declares (go.mod "go" directive).
          go-version-file: go.mod
          check-latest: false

      - name: Go environment
        run: go version && go env GOPROXY

      - name: Build
        run: go build ./...

      - name: Test
        env:
          TEST_FILTER: ${{ inputs.test-filter }}
        run: |
          set -o pipefail
          if [ -n "$TEST_FILTER" ]; then
            go test -v -count=1 -run "^($(echo "$TEST_FILTER" | tr ' ' '|'))$" ./... 2>&1 | tee /tmp/scoped.log
            for t in $TEST_FILTER; do
              grep -qE "^=== RUN[[:space:]]+${t}(/|$)" /tmp/scoped.log || { echo "selected test $t never ran"; exit 1; }
            done
          else
            go test -count=1 ./...
          fi

      - name: Build the module-zip helper
        run: |
          set -eux
          mkdir -p "${RUNNER_TEMP}/modzip"
          cp .github/modzip/create_mod.go "${RUNNER_TEMP}/modzip/"
          cd "${RUNNER_TEMP}/modzip"
          go mod init sealsecurity.io/modzip
          go get golang.org/x/mod
          go build -o "${RUNNER_TEMP}/create_mod" ./create_mod.go

      - name: Package the module zip
        run: |
          set -eux
          # zip.CreateFromDir applies the proxy's own inclusion rules (dropping
          # .git/, vendor/ and nested modules) but it keeps .github/. Upstream
          # ships no .github at all, so this workflow and its helper have to come
          # out of the tree or they would be extra members the public zip lacks.
          rm -rf .github
          mkdir -p "${RUNNER_TEMP}/build_output"
          "${RUNNER_TEMP}/create_mod" "${MODULE_PATH}" "${MODULE_VERSION}" "${GITHUB_WORKSPACE}" "${RUNNER_TEMP}/build_output/${MODULE_VERSION}.zip"
          unzip -l "${RUNNER_TEMP}/build_output/${MODULE_VERSION}.zip" | tail -n 3

      - name: Upload the module zip
        uses: actions/upload-artifact@v4
        with:
          name: module-zip
          path: ${{ runner.temp }}/build_output/v0.45.0.zip
          if-no-files-found: error
